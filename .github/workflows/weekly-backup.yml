name: Weekly Ticket Backup

on:
  schedule:
    # Every Sunday at 2:00 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      full_backup:
        description: "Run a full backup (all tickets, not just last week)"
        required: false
        type: boolean
        default: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run backup
        run: |
          if [ "${{ inputs.full_backup }}" = "true" ]; then
            npx tsx scripts/weekly-backup.ts --full
          else
            npx tsx scripts/weekly-backup.ts
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ticket-backup-${{ github.run_id }}
          path: backup-output/
          retention-days: 90
